services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - internal
    # No published ports - only the cloudflared service needs to reach this,
    # over the internal Docker network, by service name (http://app:3000).

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
